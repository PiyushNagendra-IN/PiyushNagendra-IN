<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 30" width="1200" height="30" role="img" aria-label="divider"><title>divider</title><defs><filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
<stop offset=".25" stop-color="#00f0ff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset=".75" stop-color="#00f0ff"/>
<stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
<linearGradient id="pl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="0" y="14" width="1200" height="2" fill="url(#ln)" filter="url(#glow)"/>
<rect x="-160" y="12.5" width="160" height="5" fill="url(#pl)" opacity=".9"><animate attributeName="x" from="-160" to="1200" dur="4s" repeatCount="indefinite"/></rect>
<rect x="1200" y="12.5" width="160" height="5" fill="url(#pl)" opacity=".6"><animate attributeName="x" from="1200" to="-160" dur="6s" repeatCount="indefinite"/></rect>
<g filter="url(#glow)"><rect x="592" y="7" width="16" height="16" fill="#05010f" stroke="#00f0ff" stroke-width="2" transform="rotate(45 600 15)"/>
<rect x="596" y="11" width="8" height="8" fill="#ff2bd6" transform="rotate(45 600 15)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></rect></g>
<g fill="#00f0ff" opacity=".8"><rect x="560" y="10" width="2" height="10"/><rect x="566" y="12" width="2" height="6"/><rect x="638" y="12" width="2" height="6"/><rect x="644" y="10" width="2" height="10"/></g></svg>